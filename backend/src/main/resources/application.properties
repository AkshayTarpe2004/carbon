# Local secrets: set variables in backend/.env (or .env in the working directory).
# See backend/.env.example. Loaded early via DotenvEnvironmentPostProcessor + dotenv-java.

# --- Database (defaults suit local dev; override in .env) ---
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${SERVER_PORT:8080}

# Comma-separated browser origins (no trailing slashes). Override APP_CORS_ALLOWED_ORIGINS on Render.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://personal-carbon-footprinting.netlify.app}

# JWT signing key (min 32 chars). This default is used when APP_JWT_SECRET is not set.
# IMPORTANT: The same key must be used for both token generation (login) and validation.
# If APP_JWT_SECRET is set on Render, it must be exactly: CarbonCalcStableJwtSecret2024SecureKey32Chars!!
app.jwt.secret=${APP_JWT_SECRET:CarbonCalcStableJwtSecret2024SecureKey32Chars!!}

# --- OAuth2 (set IDs/secrets in .env) ---
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.github.scope=user:email,read:user
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI}

app.oauth2.authorizedRedirectUri=${APP_OAUTH2_AUTHORIZED_REDIRECT_URI}

# --- Pending checkout ---
app.pending-payment.ttl-hours=${APP_PENDING_PAYMENT_TTL_HOURS:24}
app.pending-payment.expiry-cron=${APP_PENDING_PAYMENT_EXPIRY_CRON:0 0 * * * *}

# --- Mail (OTP, etc. — fill credentials in .env) ---
app.mail.enabled=${APP_MAIL_ENABLED}
app.mail.from=${APP_MAIL_FROM}
app.mail.from.name=${APP_MAIL_FROM_NAME}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
