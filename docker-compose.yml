# CarbonCalc — local full stack (PostgreSQL + backend + frontend)
# Usage:
#   docker compose up --build
#   Frontend: http://localhost:3000
#   Backend:  http://localhost:8080
#   Postgres: localhost:5432 (carbon_tracker / postgres / root)

services:
  db:
    image: postgres:16-alpine
    container_name: carboncalc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: carbon_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - carboncalc_pgdata:/var/lib/postgresql/data
      - ./db_scripts/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carbon_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carboncalc-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATASOURCE_URL: jdbc:postgresql://db:5432/carbon_tracker
      DATASOURCE_USER: postgres
      DATABASE_PASSWORD: root
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      APP_OAUTH2_AUTHORIZED_REDIRECT_URI: http://localhost:3000/oauth2/redirect
      GITHUB_REDIRECT_URI: http://localhost:8080/login/oauth2/code/github
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-optional}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-optional}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-optional}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-optional}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@example.com}
      APP_MAIL_FROM_NAME: ${APP_MAIL_FROM_NAME:-CarbonCalc}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: http://localhost:8080
    container_name: carboncalc-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  carboncalc_pgdata:
